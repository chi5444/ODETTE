<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Website Offline</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:linear-gradient(135deg,#0f172a,#1e293b,#111827);
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    color:#fff;
    padding:20px;
}

.container{
    width:100%;
    max-width:700px;
    background:rgba(255,255,255,.05);
    border:1px solid rgba(255,255,255,.1);
    backdrop-filter:blur(12px);
    border-radius:20px;
    padding:40px;
    text-align:center;
    box-shadow:0 20px 40px rgba(0,0,0,.4);
}

.icon{
    font-size:70px;
    margin-bottom:20px;
}

h1{
    margin-bottom:15px;
}

p{
    color:#d1d5db;
    line-height:1.8;
    margin-bottom:25px;
}

.buttons{
    display:flex;
    justify-content:center;
    gap:10px;
    flex-wrap:wrap;
}

button{
    background:#2563eb;
    color:#fff;
    border:none;
    padding:12px 25px;
    border-radius:8px;
    cursor:pointer;
    font-size:16px;
    transition:.3s;
}

button:hover{
    background:#1d4ed8;
}

.status{
    margin-top:25px;
    color:#22c55e;
    font-weight:bold;
}
</style>
</head>
<body>

<div class="container">
    <div class="icon">⚠️</div>

    <h1 id="title"></h1>
    <p id="desc"></p>

    <div class="buttons">
        <button onclick="setLang('ar')">العربية</button>
        <button onclick="setLang('en')">English</button>
        <button onclick="setLang('fr')">Français</button>
    </div>

    <div class="status" id="status"></div>
</div>

<script>

const text = {

ar:{
title:"الموقع غير متاح حالياً",
desc:"نعتذر، الموقع متوقف مؤقتًا بسبب أعمال الصيانة أو عدم توفر الاستضافة. يرجى المحاولة مرة أخرى لاحقًا.",
status:"الحالة: متوقف مؤقتًا"
},

en:{
title:"Website Currently Unavailable",
desc:"Sorry, the website is temporarily unavailable due to maintenance or hosting issues. Please try again later.",
status:"Status: Temporarily Offline"
},

fr:{
title:"Site Web Indisponible",
desc:"Désolé, le site est temporairement indisponible en raison d'une maintenance ou d'un problème d'hébergement. Veuillez réessayer plus tard.",
status:"Statut : Temporairement Hors Ligne"
}

};

function setLang(lang){

document.documentElement.lang=lang;
document.documentElement.dir=(lang==="ar")?"rtl":"ltr";

document.getElementById("title").innerHTML=text[lang].title;
document.getElementById("desc").innerHTML=text[lang].desc;
document.getElementById("status").innerHTML=text[lang].status;

}

setLang("ar");

</script>

</body>
</html>
